name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Build
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags "-X main.version=${GITHUB_REF_NAME#v}" \
            -o "knockknock_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}${ext}" \
            ./cmd/knockknock
      - uses: softprops/action-gh-release@v2
        with:
          files: knockknock_*

  checksums:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download release assets
        run: |
          gh release download "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "knockknock_*"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Generate checksums
        run: |
          sha256sum knockknock_* > "knockknock-${GITHUB_REF_NAME#v}-checksums.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: knockknock-*.txt
