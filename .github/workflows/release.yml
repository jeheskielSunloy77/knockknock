name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        os: [linux, darwin, windows]
        arch: [amd64, arm64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - name: Build
        run: |
          ext=""
          if [ "${{ matrix.os }}" = "windows" ]; then ext=".exe"; fi
          GOOS=${{ matrix.os }} GOARCH=${{ matrix.arch }} \
            go build -ldflags "-s -w -X main.version=${GITHUB_REF_NAME#v}" \
            -trimpath \
            -o "knockknock_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}${ext}" \
            ./cmd/knockknock
      - name: Compress with UPX
        if: ${{ matrix.os != 'darwin' && !(matrix.os == 'windows' && matrix.arch == 'arm64') }}
        continue-on-error: true
        run: |
          ext=""
          [ "${{ matrix.os }}" = "windows" ] && ext=".exe"
          sudo apt-get update -qq && sudo apt-get install -y -qq upx-ucl
          upx --best --lzma "knockknock_${GITHUB_REF_NAME#v}_${{ matrix.os }}_${{ matrix.arch }}${ext}"
      - uses: actions/upload-artifact@v4
        with:
          name: knockknock_${{ matrix.os }}_${{ matrix.arch }}
          path: knockknock_*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect artifacts and generate checksums
        run: |
          find artifacts -type f -exec mv {} . \;
          rm -rf artifacts
          sha256sum knockknock_* > "knockknock-${GITHUB_REF_NAME#v}-checksums.txt"
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            knockknock_*
            knockknock-*.txt
