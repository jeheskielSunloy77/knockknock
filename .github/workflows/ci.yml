name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: true
      - run: go vet ./...
      - run: go build ./cmd/knockknock
      - run: go run ./cmd/knockknock compile
      - run: go test -race -count=1 ./...
